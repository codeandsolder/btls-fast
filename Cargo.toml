[workspace]
members = [
    "btls",
    "btls-sys",
    "tokio-btls",
    "tokio-btls/bench",
    "jsonwebtoken-btls",
]
default-members = [
    "btls",
    "btls-sys",
    "tokio-btls",
    "jsonwebtoken-btls",
]
resolver = "3"

[workspace.package]
version = "0.5.6"
repository = "https://github.com/0x676e67/btls"
edition = "2024"
rust-version = "1.100"

[workspace.metadata.release]
pre-release-commit-message = "Release {{version}}"
shared-version = true
tag-prefix = ""
publish = false

[workspace.dependencies]
btls-sys = { version = "0.5.6", path = "./btls-sys" }
btls = { version = "0.5.6", path = "./btls" }
tokio-btls = { version = "0.5.6", path = "./tokio-btls" }

bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
bitflags = "2.11.1"
brotli = "9.0.0"
cmake = "0.1.58"
foreign-types = "0.5"
libc = "0.2.185"
hex = "0.4"
futures = "0.3"
tokio = "1.52.1"
openssl-macros = "0.1.1"

# Benchmarks only (tokio-btls/bench).
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
cpu-time = "1.0.0"
criterion = "0.8.2"
sysinfo = { version = "0.40.0", default-features = false }
tikv-jemallocator = { version = "0.7.0", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }

[profile.bench]
codegen-units = 1
