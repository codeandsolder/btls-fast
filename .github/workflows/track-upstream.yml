name: Track upstream

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@3b7b40d9c0f9b22a3eba78c698231d2e086369bc # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
