name: Track upstream

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@7df510a2053e220c010c331b5daef81a593a19bb # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      strategy: merge
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
