name: Track upstream

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
