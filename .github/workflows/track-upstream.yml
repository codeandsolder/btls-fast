name: Track upstream

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@343303848026ed142e48a6a82e7a889080b99b26 # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
