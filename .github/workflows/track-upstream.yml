name: Track upstream

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@a50ec6783a6754f6f3d4fdd77542d934e72be681 # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      strategy: merge
      workflow-policy: reject
      rust-toolchain: repository
      validation-script: .github/scripts/validate-upstream.sh
