name: Track upstream

on:
  schedule:
    - cron: "57 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      upstream-repository: 0x676e67/btls
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
