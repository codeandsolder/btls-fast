name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@e39ba876b351c5ea4bc01ac906305729b2fe7565 # main
        if: github.event_name == 'pull_request'
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          lockfile: auto
          hours: "72"
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@e39ba876b351c5ea4bc01ac906305729b2fe7565 # main
    with:
      runner: ubuntu-26.04
      rust-components: "clippy rustfmt"
      command: |
        git submodule update --init --recursive
        bash .github/scripts/validate-upstream.sh
