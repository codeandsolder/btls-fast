name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      runner: ubuntu-26.04
      checkout-submodules: recursive
      rust-targets: aarch64-unknown-linux-gnu
      timeout-minutes: 45
      apt-packages: binutils ripgrep clang libc++-dev libc++abi-dev crossbuild-essential-arm64
      command: |
        cargo doc --locked --no-deps -p btls -p btls-sys -p tokio-btls --features mldsa,mlkem,prf,rpk,underscore-wildcards,relax-cert-validation
        scripts/test-cxx-runtime dynamic stdc++
        scripts/test-cxx-runtime static stdc++
        CC=clang CXX=clang++ CXXFLAGS=-stdlib=libc++ scripts/test-cxx-runtime dynamic c++
        CC=clang CXX=clang++ CXXFLAGS=-stdlib=libc++ scripts/test-cxx-runtime static c++
        env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc scripts/test-cxx-runtime static stdc++ aarch64-unknown-linux-gnu
      strict-suites: |
        [
          {"name":"tls-features","cargo":["--locked","--workspace","--all-targets","--features","mldsa,mlkem,prf,rpk,underscore-wildcards,relax-cert-validation"],"allow-test-panics":true},
          {"name":"static-cxx-runtime","cargo":["--locked","-p","btls","-p","btls-sys","-p","tokio-btls","-p","jsonwebtoken-btls","--all-targets","--features","static-cxx-runtime"],"allow-test-panics":true}
        ]
      test-suites: |
        [
          {"name":"tls","cargo":["--locked","-p","btls","-p","btls-sys","-p","tokio-btls","--features","mldsa,mlkem,prf,rpk,underscore-wildcards,relax-cert-validation"],"doctests":["--locked","-p","btls","-p","btls-sys","-p","tokio-btls","--features","mldsa,mlkem,prf,rpk,underscore-wildcards,relax-cert-validation"]},
          {"name":"benchmark-library","cargo":["--locked","-p","tokio-btls-bench","--lib"]},
          {"name":"jwt","cargo":["--locked","-p","jsonwebtoken-btls"],"doctests":["--locked","-p","jsonwebtoken-btls"]}
        ]
